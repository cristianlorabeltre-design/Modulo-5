<body>

  <h1 id="inicio">Ejemplo de Enlaces</h1>

  <!-- Enlace absoluto -->
  <p>
    <a href="https://www.google.com">Enlace absoluto (Google)</a>
  </p>

  <!-- Enlace relativo -->
  <p>
    <a href="pagina2.html">Enlace relativo (otra página del sitio)</a>
  </p>

  <!-- Enlace interno -->
  <p>
    <a href="#final">Ir al final de la página</a>
  </p>

  <!-- Enlace externo -->

    <a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">
      Enlace externo (Wikipedia)
    </a>
  </p>

  <br><br><br><br><br><br><br><br><br><br>

  <h2 id="final">Final de la página</h2>
  <p><a href="#inicio">Volver al inicio</a></p>

</html>
