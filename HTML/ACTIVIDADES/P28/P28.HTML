<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Atributos de enlaces</title>
</head>
<body>

  <h1>Ejemplo de atributos</h1>

  <!-- Enlace que abre en nueva pestaña con título -->
  <p>
    <a href="https://www.google.com" target="_blank" title="Buscar en Google">
      Ir a Google
    </a>
  </p>

  <!-- Enlace seguro -->
  <p>
    <a href="https://www.ejemplo.com" rel="noopener noreferrer">
      Enlace seguro
    </a>
  </p>

  <!-- Enlace de descarga -->
  <p>
    <a href="archivo.pdf" download>
      Descargar documento
    </a>
  </p>

</body>
</html>
